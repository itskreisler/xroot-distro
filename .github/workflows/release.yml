name: release

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Tag a publicar (vacío = siguiente versión automática)'
        required: false
        default: ''
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-smoke:
    name: Windows launcher smoke test
    if: ${{ !contains(github.event.head_commit.message, '[skip windows]') }}
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar MinGW-w64
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc

      - name: Compilar lanzadores Windows
        shell: msys2 {0}
        run: |
          gcc -municode -static -O2 -Wall -Wextra -o xroot-distro.exe windows-launcher.c
          cp xroot-distro.exe xd.exe

      - name: Instalar WSL2 con Debian
        if: ${{ !contains(github.event.head_commit.message, '[skip windows-tests]') }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          wsl.exe --set-default-version 2
          if ($LASTEXITCODE -ne 0) { throw "No se pudo establecer WSL2: $LASTEXITCODE" }
          wsl.exe --install Debian --web-download --no-launch
          if ($LASTEXITCODE -ne 0) { throw "No se pudo instalar Debian en WSL: $LASTEXITCODE" }
          wsl.exe --distribution Debian --user root --exec sh -lc "grep -qi 'microsoft.*WSL2' /proc/version"
          if ($LASTEXITCODE -ne 0) { throw 'La distribución no se está ejecutando en WSL2' }

      - name: Compilar e instalar el binario Linux en WSL
        if: ${{ !contains(github.event.head_commit.message, '[skip windows-tests]') }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $repoWindowsPath = (Resolve-Path .).Path
          $repoLinuxPath = (& wsl.exe --distribution Debian --user root --exec wslpath -a $repoWindowsPath | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or -not $repoLinuxPath) { throw 'No se pudo acceder al checkout desde WSL' }

          $escapedQuote = "'" + '"' + "'" + '"' + "'"
          $quotedRepo = "'" + $repoLinuxPath.Replace("'", $escapedQuote) + "'"
          $setupCommand = @"
          set -eu
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq build-essential libcurl4-openssl-dev zlib1g-dev liblzma-dev libssl-dev
          mkdir -p /tmp/xroot-distro-windows-smoke
          cp -a $quotedRepo/. /tmp/xroot-distro-windows-smoke/
          make -C /tmp/xroot-distro-windows-smoke binaries
          install -m 755 /tmp/xroot-distro-windows-smoke/xroot-distro /usr/local/bin/xroot-distro
          install -m 755 /tmp/xroot-distro-windows-smoke/xd /usr/local/bin/xd
          "@

          & wsl.exe --distribution Debian --user root --exec sh -lc $setupCommand
          if ($LASTEXITCODE -ne 0) { throw "Falló la compilación/instalación en WSL: $LASTEXITCODE" }

      - name: Probar los ejecutables Windows contra WSL2
        if: ${{ !contains(github.event.head_commit.message, '[skip windows-tests]') }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:XROOT_DISTRO_WSL_DISTRO = 'Debian'

          $output = & .\xroot-distro.exe help
          if ($LASTEXITCODE -ne 0) { throw "xroot-distro.exe terminó con $LASTEXITCODE" }
          if (($output -join "`n") -notmatch 'Uso: xroot-distro') { throw 'xroot-distro.exe no devolvió la ayuda esperada desde WSL' }

          $output = & .\xd.exe help
          if ($LASTEXITCODE -ne 0) { throw "xd.exe terminó con $LASTEXITCODE" }
          if (($output -join "`n") -notmatch 'Uso: xd') { throw 'xd.exe no devolvió la ayuda esperada desde WSL' }

  release:
    name: tools → test → hash → release
    needs: windows-smoke
    if: ${{ always() && github.event_name != 'pull_request' && (needs.windows-smoke.result == 'success' || needs.windows-smoke.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar herramientas
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential \
            libcurl4-openssl-dev \
            zlib1g-dev \
            liblzma-dev \
            libssl-dev \
            clang-format \
            clang-tidy \
            shellcheck \
            gcc-mingw-w64-x86-64 \
            zip \
            python3
          command -v gcc make clang-format clang-tidy shellcheck gh x86_64-w64-mingw32-gcc zip

      - name: Compilar y analizar
        run: |
          make binaries
          make lint
          shellcheck install.sh test.sh

      - name: Preparar entorno de pruebas (rootfs Alpine)
        run: |
          sudo mkdir -p /content
          sudo cp README.md /content/README.md
          sudo env XROOT_DISTRO_SHA256=c5ca053cfe1d85c5b96dff8b9bc57045f7f184a30ffb6b65776409ca90388677 \
            ./xroot-distro install -n=alpine \
            https://dl-cdn.alpinelinux.org/alpine/v3.24/releases/x86_64/alpine-minirootfs-3.24.2-x86_64.tar.gz
          sudo ./xroot-distro list

      - name: Batería completa de pruebas (requiere root)
        run: |
          set -o pipefail
          sudo bash test.sh
          grep '===== RESUMEN' test.log | tail -n 1 | tee -a "$GITHUB_STEP_SUMMARY"
        shell: bash

      - name: Restaurar permisos del workspace
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" .

      - name: Verificar hash en cada commit
        run: |
          make release REPO='${{ github.repository }}' VERSION="ci-${GITHUB_SHA::7}"
          make windows-launchers
          mkdir -p dist/windows-wsl
          cp xroot-distro.exe xd.exe install-wsl.ps1 dist/windows-wsl/
          cp dist/xroot-distro-linux-x86_64.tar.gz dist/windows-wsl/
          cp dist/SHA256SUMS dist/windows-wsl/
          (cd dist/windows-wsl && zip -q ../xroot-distro-windows-wsl-x86_64.zip *)
          rm -rf dist/windows-wsl
          (cd dist && sha256sum xroot-distro-linux-x86_64.tar.gz xroot-distro-src-*.tar.gz \
            xroot-distro-windows-wsl-x86_64.zip > SHA256SUMS)
          BASE_URL="file://$PWD/dist" sh install.sh -p "$RUNNER_TEMP/xroot-hash-check"
          cmp "$RUNNER_TEMP/xroot-hash-check/bin/xd" xd
          (cd dist && sha256sum -c SHA256SUMS)
          printf 'Hashes verificados para %s\n' "$GITHUB_SHA" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Decidir versión y salto de release
        id: meta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          input_version='${{ github.event.inputs.version }}'
          if [ -n "$input_version" ]; then
            VERSION="$input_version"
          elif [ '${{ github.ref_type }}' = 'tag' ]; then
            VERSION='${{ github.ref_name }}'
          else
            latest=$(gh release view --json tagName -q .tagName 2>/dev/null || true)
            if [ -z "$latest" ]; then
              VERSION='v0.1.0'
            else
              VERSION=$(python3 - "$latest" <<'PYVER'
          import re
          import sys

          match = re.fullmatch(r"v(\d+)\.(\d+)\.(\d+)", sys.argv[1].strip())
          if match:
              major, minor, patch = match.groups()
              print(f"v{major}.{minor}.{int(patch) + 1}")
          else:
              print("v0.1.0")
          PYVER
          )
            fi
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          printf '%s\n' "VERSION=$VERSION" >> "$GITHUB_ENV"

          if [ '${{ github.ref_type }}' = 'tag' ]; then
            previous=$(git describe --tags --abbrev=0 "${GITHUB_SHA}^" 2>/dev/null || true)
            if [ -n "$previous" ]; then
              range="$previous..$GITHUB_SHA"
            else
              range='-1'
            fi
          else
            range='-1'
          fi
          if git log $range --pretty=%B | grep -qiF '[skip release]'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            printf 'Release omitido: [skip release] en los commits (%s)\n' "$range" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Preparar artefactos del release
        if: steps.meta.outputs.skip != 'true'
        run: |
          make release REPO='${{ github.repository }}' VERSION="$VERSION"
          make windows-launchers
          mkdir -p dist/windows-wsl
          cp xroot-distro.exe xd.exe install-wsl.ps1 dist/windows-wsl/
          cp dist/xroot-distro-linux-x86_64.tar.gz dist/windows-wsl/
          cp dist/SHA256SUMS dist/windows-wsl/
          (cd dist/windows-wsl && zip -q ../xroot-distro-windows-wsl-x86_64.zip *)
          rm -rf dist/windows-wsl
          (cd dist && sha256sum xroot-distro-linux-x86_64.tar.gz xroot-distro-src-*.tar.gz \
            xroot-distro-windows-wsl-x86_64.zip > SHA256SUMS)
          ls -lh dist
          cat dist/SHA256SUMS

      - name: Publicar release
        if: steps.meta.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            git tag "$VERSION"
            git push origin "$VERSION"
          fi
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" dist/* --clobber
          else
            gh release create "$VERSION" dist/* \
              --title "$VERSION" \
              --generate-notes \
              --verify-tag
          fi
          gh release view "$VERSION" --json tagName,assets
